name: Build unsigned IPA

# 没有 Mac 也能用：在 GitHub 的 macOS 云主机上编译出未签名 IPA。
# 仅手动触发（workflow_dispatch），避免上传文件时每个 commit 都自动跑。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project AIChatApp.xcodeproj \
            -scheme AIChatApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath .build \
            -archivePath build/AIChatApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build.log

      - name: Emit build errors (annotations)
        if: failure()
        run: |
          grep -E "error:|fatal error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p build/Payload
          cp -R build/AIChatApp.xcarchive/Products/Applications/AIChatApp.app build/Payload/
          (cd build && zip -qry AIChatApp-unsigned.ipa Payload)

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIChatApp-unsigned
          path: build/AIChatApp-unsigned.ipa
          retention-days: 7
