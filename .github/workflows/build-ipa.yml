name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        id: gen
        run: |
          {
            echo "PWD=$(pwd)"
            echo "--- ls before ---"
            ls -la
            echo "--- which xcodegen ---"
            command -v xcodegen || echo "NOT_FOUND"
            echo "--- xcodegen version ---"
            xcodegen --version 2>&1 || echo "VERSION_FAIL"
            echo "--- generate ---"
            xcodegen generate 2>&1
            echo "--- ls after ---"
            ls -la
            test -d AIChatApp.xcodeproj && echo "PROJECT_EXISTS=yes" || echo "PROJECT_EXISTS=no"
          } > gen.log 2>&1
          cat gen.log
          if ! grep -q "PROJECT_EXISTS=yes" gen.log; then
            while IFS= read -r line; do echo "::error::GEN|${line}"; done < gen.log
            exit 1
          fi

      - name: Build unsigned archive
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project AIChatApp.xcodeproj \
            -scheme AIChatApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath .build \
            -archivePath build/AIChatApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build.log

      - name: Emit build errors (annotations)
        if: failure()
        run: |
          grep -E "error:|fatal error:|BUILD FAILED|The following build commands failed" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p build/Payload
          cp -R build/AIChatApp.xcarchive/Products/Applications/AIChatApp.app build/Payload/
          (cd build && zip -qry AIChatApp-unsigned.ipa Payload)

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIChatApp-unsigned
          path: build/AIChatApp-unsigned.ipa
          retention-days: 7
