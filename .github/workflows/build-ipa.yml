name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          {
            echo "XCODEBUILD_VERSION=$(xcodebuild -version 2>&1 | tr '\n' ' ')"
            echo "XCODEGEN_VERSION=$(xcodegen --version 2>&1 | head -1)"
            echo "XCODE_SELECT=$(xcode-select -p 2>&1)"
            xcodegen generate > gen.log 2>&1
            echo "XCODEGEN_EXIT=$?"
            echo "PBPROJ_EXISTS=$(test -f AIChatApp.xcodeproj/project.pbxproj && echo yes || echo no)"
            echo "PBPROJ_SIZE=$(wc -c < AIChatApp.xcodeproj/project.pbxproj 2>/dev/null || echo 0)"
            echo "PBPROJ_HEAD=$(head -c 150 AIChatApp.xcodeproj/project.pbxproj 2>/dev/null | tr '\n' ' ')"
            echo "XCODEGEN_OUT=$(cat gen.log | tr '\n' ' ' | head -c 300)"
          } | while IFS= read -r line; do echo "::error::D|${line}"; done

      - name: Build unsigned archive
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project AIChatApp.xcodeproj \
            -scheme AIChatApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath .build \
            -archivePath build/AIChatApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build.log

      - name: Emit build errors (annotations)
        if: failure()
        run: |
          grep -E "error:|fatal error:|BUILD FAILED|The following build commands failed" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p build/Payload
          cp -R build/AIChatApp.xcarchive/Products/Applications/AIChatApp.app build/Payload/
          (cd build && zip -qry AIChatApp-unsigned.ipa Payload)

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIChatApp-unsigned
          path: build/AIChatApp-unsigned.ipa
          retention-days: 7
