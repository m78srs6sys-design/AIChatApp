# AIChatApp — XcodeGen 工程描述文件
# 用法（在 macOS 上）：xcodegen generate
# 即可生成 AIChatApp.xcodeproj，然后运行 ./build_ipa.sh 编译出未签名 IPA
name: AIChatApp

options:
  bundleIdPrefix: com.aichat
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 关键：固定生成 Xcode 15 兼容的工程格式（objectVersion 56），
  # 否则新版 XcodeGen 会生成 Xcode 16 专用的 objectVersion 77，Xcode 15.4 无法读取。
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # 未签名编译相关，构建脚本里还会再显式传一次
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  AIChatApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources
      - path: SupportingFiles/Assets.xcassets

    # 注：本地离线推理（llama.cpp）依赖已移除，当前为「仅联网对话」版本。
    # 无任何第三方 SPM 依赖，编译更稳定。

    # 直接使用自定义 Info.plist（含权限描述、ATS、深色主题等关键键）
    # 注意：不要用 XcodeGen 的 info: 生成，否则会覆盖丢失这些键
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aichat.app
        PRODUCT_NAME: AIChatApp
        INFOPLIST_FILE: SupportingFiles/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # 保留完整调试符号，便于后续自己重签名/调试
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
